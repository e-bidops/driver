name: ⚡ Google Drive Cloud Copier

on:
  workflow_dispatch:
    inputs:
      source_folder:
        description: '🔗 Link / ID Folder Sumber Google Drive'
        required: true
        type: string
      dest_folder:
        description: '🎯 Link / ID Folder Tujuan Google Drive'
        required: true
        type: string

jobs:
  copy_drive_files:
    runs-on: ubuntu-latest
    name: Duplicate Google Drive Folders
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Google Drive Copier
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        run: |
          python drive_copier.py --source "${{ inputs.source_folder }}" --dest "${{ inputs.dest_folder }}"
